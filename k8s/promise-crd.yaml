# Promise Theory: an agent promises only about its own behaviour.
# spec is written by the promiser. Any promise is accepted; only one with `refrains` can be
# checked by the operator (status). The others are judged only by other agents' Assessments.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: promises.society.local
spec:
  group: society.local
  scope: Namespaced
  names:
    kind: Promise
    plural: promises
    singular: promise
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Promiser, type: string, jsonPath: .spec.promiser}
        - {name: Refrains, type: string, jsonPath: .spec.refrains}
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Violations, type: integer, jsonPath: .status.violations}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [promiser, body, tick]
              properties:
                promiser: {type: string}
                body: {type: string, maxLength: 500}
                # Optional: set only when the promise is never to take an action the code can observe.
                refrains: {type: string, enum: [steal]}
                tick: {type: integer, minimum: 0}
            status:
              type: object
              properties:
                state: {type: string, enum: [kept, broken]}
                violations: {type: integer, minimum: 0}
                checkedTick: {type: integer}
