# The always-on world: the operator and one world in a single pod, sharing the SQLite volume.
# Order: base.yaml, the society-keys secret, genesis-job.yaml (once), then this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: society
  namespace: society-system
spec:
  replicas: 1
  # Recreate: two pods must never write the same SQLite files.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: society}
  template:
    metadata:
      labels: {app: society}
    spec:
      serviceAccountName: society
      volumes:
        - name: worlds
          persistentVolumeClaim:
            claimName: worlds
      containers:
        - name: operator
          image: society:dev
          imagePullPolicy: Never
          # --standalone: one operator only, no peering objects needed.
          command: [kopf, run, --standalone, --all-namespaces, promise_operator.py]
          volumeMounts: [{name: worlds, mountPath: /data}]
          resources:
            requests: {memory: 64Mi, cpu: 20m}
            limits: {memory: 192Mi}
        - name: bot
          image: society:dev
          imagePullPolicy: Never
          command: [python, bot.py, run, genesis]
          envFrom:
            - secretRef: {name: society-keys}
          volumeMounts: [{name: worlds, mountPath: /data}]
          resources:
            requests: {memory: 48Mi, cpu: 10m}
            limits: {memory: 128Mi}
        - name: live
          image: society:dev
          imagePullPolicy: Never
          command: [python, live.py, genesis, --port, "8080"]
          ports: [{containerPort: 8080}]
          # Read-only twice over: this mount, and SQLite opened with mode=ro in live.py.
          volumeMounts: [{name: worlds, mountPath: /data, readOnly: true}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
        - name: world
          image: society:dev
          imagePullPolicy: Never
          command: [python, world.py, run, genesis]
          # API keys: kubectl -n society-system create secret generic society-keys --from-env-file=.env
          envFrom:
            - secretRef: {name: society-keys}
          volumeMounts: [{name: worlds, mountPath: /data}]
          resources:
            requests: {memory: 64Mi, cpu: 20m}
            limits: {memory: 192Mi}
---
# Inside the cluster only; Caddy (caddy.yaml) is the one door from the internet.
apiVersion: v1
kind: Service
metadata:
  name: society-live
  namespace: society-system
spec:
  selector: {app: society}
  ports: [{port: 8080, targetPort: 8080}]
