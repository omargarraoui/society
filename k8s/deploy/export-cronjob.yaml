# Every hour, publishes a snapshot of the genesis world to the public dashboard (GitHub Pages).
# Needs GITHUB_TOKEN and GITHUB_REPO in the society-keys secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: export
  namespace: society-system
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: society
          restartPolicy: Never
          volumes:
            - name: worlds
              persistentVolumeClaim:
                claimName: worlds
          containers:
            - name: export
              image: society:dev
              imagePullPolicy: Never
              command: [python, export.py, data, genesis]
              envFrom:
                - secretRef: {name: society-keys}
              volumeMounts: [{name: worlds, mountPath: /data}]
              resources:
                requests: {memory: 48Mi, cpu: 10m}
                limits: {memory: 128Mi}
