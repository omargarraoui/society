[project]
name = "society"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["kopf==1.45.2", "kubernetes==37.0.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "BLE001", "PLC0415"]
